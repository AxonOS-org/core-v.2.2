# AxonOS Kernels — Continuous Integration
#
# All jobs are required gates. No soft-failures: a failing Kani proof,
# Miri UB detection, or cargo-deny advisory breaks the pipeline.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel in-flight runs on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Tests across three host operating systems ─────────────────────────
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace --all-features

  # ── 2. Format check ───────────────────────────────────────────────────────
  fmt:
    name: rustfmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── 3. Clippy ─────────────────────────────────────────────────────────────
  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── 4. MSRV pin ───────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.75)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # ── 5. no_std builds on embedded targets ─────────────────────────────────
  no-std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf
          - thumbv8m.main-none-eabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --target ${{ matrix.target }}
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p axonos-spsc \
            -p axonos-scheduler \
            -p axonos-capability \
            -p axonos-time \
            -p axonos-intent \
            -p axonos-kernel-core

  # ── 6. Documentation build ───────────────────────────────────────────────
  docs:
    name: docs -D rustdoc warnings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  # ── 7. Miri (undefined behaviour detection on the unsafe surface) ────────
  miri:
    name: miri (axonos-spsc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: miri test axonos-spsc
        run: cargo miri test -p axonos-spsc

  # ── 8. Kani bounded model checking ───────────────────────────────────────
  # Each crate runs as an independent matrix job. All proofs are required
  # gates: a timeout or counter-example breaks the pipeline.
  #
  # The Kani toolchain (CBMC + Kani binaries) is cached under ~/.kani to
  # avoid reinstalling on every run.
  #
  # To run locally:
  #   cargo install --locked kani-verifier
  #   cargo kani setup
  #   cd axonos-X/kani-proofs && cargo kani --default-unwind 16
  kani:
    name: kani (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crate:
          - axonos-spsc
          - axonos-scheduler
          - axonos-capability
          - axonos-time
          - axonos-intent
    steps:
      - uses: actions/checkout@v4

      - name: Cache Kani toolchain
        id: cache-kani
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
          key: kani-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            kani-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Kani
        if: steps.cache-kani.outputs.cache-hit != 'true'
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Run Kani proofs
        working-directory: ${{ matrix.crate }}/kani-proofs
        run: cargo kani --default-unwind 16

  # ── 9. Bare-metal firmware build (Cortex-M4F) ────────────────────────────
  firmware:
    name: firmware (STM32F407)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build firmware
        working-directory: axonos-firmware-stm32f407
        run: cargo build --release --target thumbv7em-none-eabihf

  # ── 10. cargo-deny (licence + advisory + bans audit) ─────────────────────
  # Pinned to v1: v2 has compatibility issues with cargo-deny 0.15+.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check bans licenses sources
